server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-friendly fallback (single page, but harmless if more pages are added later)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets, always revalidate the HTML shell
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    gzip on;
    gzip_types text/css application/javascript text/html;
}
